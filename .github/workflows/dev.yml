name: CI/CD Homologation (dev)

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov

      - name: Run Pytest
        run: pytest

  deploy-dev:
    name: Deploy to Homologation (dev)
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      # Função compartilhada `cpf-auth`. Deploy full do stack quebra (API GW REST
      # legado + EarlyValidation). Atualiza só o artefato da Lambda.
      - name: Deploy Lambda function code (dev)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: 'us-east-1'
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail
          npx serverless@3.38.0 package --stage dev
          ZIP="$(find .serverless -name '*.zip' | head -n 1)"
          test -n "$ZIP"
          aws lambda update-function-code \
            --function-name cpf-auth \
            --zip-file "fileb://${ZIP}" \
            --region us-east-1
          aws lambda wait function-updated --function-name cpf-auth --region us-east-1
          aws lambda get-function-configuration --function-name cpf-auth --region us-east-1 \
            --query '{FunctionName:FunctionName,LastModified:LastModified,Runtime:Runtime}' \
            --output table
